name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN minimal pour checkout + lecture Actions (badge CI).
permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate optional Aerys/Cursor secrets format
        env:
          # Optional — absent secrets are skipped. See README § Configuration secrets.
          CURSOR_REPO_MAP: ${{ secrets.CURSOR_REPO_MAP }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AERYS_CONNECTOR_CONFIG: ${{ secrets.AERYS_CONNECTOR_CONFIG }}
        run: node scripts/validate-secrets.js
      - name: Verify Milan setup prerequisites
        run: node scripts/verify-milan-setup.js
      - name: Verify CI workflow structure (deployment gate)
        run: node scripts/verify-ci-workflow.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: pip install -r requirements.txt
      - name: Run platform pytest suite
        run: python -m pytest tests/ -q
      - run: npm test
      - run: npm run lint
